<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recette: Tarte aux pommes</title>
    <link rel="stylesheet" href="./assets/reset.css" />
    <link rel="stylesheet" href="./assets/recipe.css" />
  </head>
  <body>
    <a href="./index.html" class="navbar"></a>
    <div class="recipe">
      <div class="recipe-header">
        <div class="recipe-image-container">
          <div class="recipe-image-wrapper">
            <img src="./images/original/19.jpg" alt="Tarte aux pommes" />
          </div>
        </div>
        <div>
          <h1 class="recipe-title">Tarte aux pommes</h1>
          <div class="recipe-detail"><b>Préparation: </b>20 minutes</div>
          <div class="recipe-detail"><b>Cuisson: </b>40 minutes</div>
        </div>
      </div>

      <h2>Ingrédients</h2>
      <ul class="ing-list">
        <li>
          <span>8 <span class="food-name">pommes</span></span>
          <div class="ing-btn"><img src="./assets/pencil-square.svg" /></div>
        </li>
        <li>
          <span>1/2 t de <span class="food-name">cassonade</span></span>
          <div class="ing-btn"><img src="./assets/pencil-square.svg" /></div>
        </li>
        <li>
          <span>1/4 c. à thé de <span class="food-name">cannelle moulue</span></span>
          <div class="ing-btn"><img src="./assets/pencil-square.svg" /></div>
        </li>
        <li>
          <span>2 c. à soupe de <span class="food-name">fécule de maïs</span></span>
          <div class="ing-btn"><img src="./assets/pencil-square.svg" /></div>
        </li>
        <li>
          <span>3 c. à soupe de <span class="food-name">beurre non salé</span></span>
          <div class="ing-btn"><img src="./assets/pencil-square.svg" /></div>
        </li>
        <li>
          <span>1 <span class="food-name">abaisse de pâte brisée non cuite</span></span>
          <div class="ing-btn"><img src="./assets/pencil-square.svg" /></div>
        </li>
      </ul>

      <h2>Instructions</h2>
      <div class="recipe-instructions">
      </div>
    </div>
  </body>
</html>
