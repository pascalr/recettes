<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recette: Madeleines au miel</title>
    <link rel="stylesheet" href="../assets/reset.css" />
    <link rel="stylesheet" href="../assets/recipe.css" />
  </head>
  <body>
    <a href="../index.html" class="navbar"></a>
    <div class="recipe">
      <div class="recipe-header">
        <div class="recipe-image-container">
          <div class="recipe-image-wrapper">
            <img src="../images/original/3.jpg" alt="Madeleines au miel" />
          </div>
        </div>
        <div>
          <h1 class="recipe-title">Madeleines au miel</h1>
          <div class="recipe-detail"><b>Préparation: </b>25 minutes</div>
          <div class="recipe-detail"><b>Cuisson: </b>6 minutes</div>
          <div class="recipe-detail"><b>Total: </b>1 hour</div>
        </div>
      </div>

      <h2>Ingrédients</h2>
      <ul class="ing-list">
        <li>
          <span>0.75 t de <span class="food-name">farine tout usage</span></span>
          <div class="ing-btn"><img src="../assets/pencil-square.svg" /></div>
        </li>
        <li>
          <span>0.25 c. à thé de <span class="food-name">poudre à pâte</span></span>
          <div class="ing-btn"><img src="../assets/pencil-square.svg" /></div>
        </li>
        <li>
          <span>0.25 c. à thé de <span class="food-name">sel</span></span>
          <div class="ing-btn"><img src="../assets/pencil-square.svg" /></div>
        </li>
        <li>
          <span>2 <span class="food-name">oeuf</span></span>
          <div class="ing-btn"><img src="../assets/pencil-square.svg" /></div>
        </li>
        <li>
          <span>0.5 t de <span class="food-name">miel</span></span>
          <div class="ing-btn"><img src="../assets/pencil-square.svg" /></div>
        </li>
        <li>
          <span>0.5 t de <span class="food-name">beurre non salé</span></span>
          <div class="ing-btn"><img src="../assets/pencil-square.svg" /></div>
        </li>
      </ul>

      <h2>Instructions</h2>
      <div class="recipe-instructions">
      </div>
    </div>
  </body>
</html>
