<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recette: Sauce nems</title>
  <link rel="stylesheet" href="../assets/reset.css" />
  <link rel="stylesheet" href="../assets/recipe.css" />
</head>

<body>
  <a href="../index.html" class="navbar"></a>
  <div class="recipe">
    <div class="recipe-header">
      <div class="recipe-image-container">
        <div class="recipe-image-wrapper">
          <img src="../assets/recipe_placeholder.png" alt="Sauce nems" />
        </div>
      </div>
      <div>
        <h1 class="recipe-title">Sauce nems</h1>

      </div>
    </div>
    <h2>Ingrédients</h2>
    <ul class="ing-list">
      <li>
        <span><span class="food-name">eau</span></span>
        <div class="ing-btn"><img src="../assets/pencil-square.svg" /></div>
      </li>
      <li>
        <span><span class="food-name">vinaigre blanc</span></span>
        <div class="ing-btn"><img src="../assets/pencil-square.svg" /></div>
      </li>
      <li>
        <span><span class="food-name">sucre</span></span>
        <div class="ing-btn"><img src="../assets/pencil-square.svg" /></div>
      </li>
      <li>
        <span><span class="food-name">carotte</span></span>
        <div class="ing-btn"><img src="../assets/pencil-square.svg" /></div>
      </li>
      <li>
        <span><span class="food-name">nuoc mâm</span></span>
        <div class="ing-btn"><img src="../assets/pencil-square.svg" /></div>
      </li>
    </ul>

    <h2>Instructions</h2>
    <div class="recipe-instructions">
      <div class="recipe-step">
        Râper un peu de <span class="food-name">carotte</span> finement.
      </div>

      <div class="recipe-step">
        Faire tremper dans de l'<span class="food-name">eau</span>, du <span class="food-name">sucre</span> et du <span class="food-name">vinaigre blanc</span>.
      </div>

      <div class="recipe-step">
        Ajouter du <span class="food-name">nuoc mâm</span> et de l'<span class="food-name">eau</span> au goût.
      </div>

    </div>
  </div>
</body>

</html>
