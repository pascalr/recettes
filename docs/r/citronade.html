<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recette: Citronade</title>
    <link rel="stylesheet" href="../assets/reset.css" />
    <link rel="stylesheet" href="../assets/recipe.css" />
  </head>
  <body>
    <a href="../index.html" class="navbar"></a>
    <div class="recipe">
      <div class="recipe-header">
        <div class="recipe-image-container">
          <div class="recipe-image-wrapper">
            <img src="../images/original/147.jpeg" alt="Citronade" />
          </div>
        </div>
        <div>
          <h1 class="recipe-title">Citronade</h1>
        </div>
      </div>

      <h2>Ingrédients</h2>
      <ul class="ing-list">
        <li>
          <span>4 <span class="food-name">citrons</span></span>
          <div class="ing-btn"><img src="../assets/pencil-square.svg" /></div>
        </li>
        <li>
          <span>4 c. à soupe de <span class="food-name">sucre</span></span>
          <div class="ing-btn"><img src="../assets/pencil-square.svg" /></div>
        </li>
        <li>
          <span>1 1/2 L d'<span class="food-name">eau</span></span>
          <div class="ing-btn"><img src="../assets/pencil-square.svg" /></div>
        </li>
      </ul>

      <h2>Instructions</h2>
      <div class="recipe-instructions">
        <div class="recipe-step">
          Presser 4 <span class="food-name">citrons</span>.
        </div>
        <div class="recipe-step">
          Dissoudre 4 c. à soupe de <span class="food-name">sucre</span> dans le concentré de citron en mélangeant.
        </div>
        <div class="recipe-step">
          Ajouter 1 1/2 L d'<span class="food-name">eau</span> et servir.
        </div>
      </div>
    </div>
  </body>
</html>
