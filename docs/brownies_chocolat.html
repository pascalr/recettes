<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recette: Brownies au chocolat</title>
    <link rel="stylesheet" href="./assets/reset.css" />
    <link rel="stylesheet" href="./assets/recipe.css" />
  </head>
  <body>
    <div class="recipe">
      <div class="recipe-header">
        <div class="recipe-image-container">
          <div class="recipe-image-wrapper">
            <img src="./images/original/28.jpg" alt="Brownies au chocolat" />
          </div>
        </div>
        <div>
          <h1 class="recipe-title">Brownies au chocolat</h1>
          <div class="recipe-detail"><b>Préparation: </b>10 minutes</div>
          <div class="recipe-detail"><b>Cuisson: </b>30 minutes</div>
        </div>
      </div>

      <h2>Ingrédients</h2>
      <ul class="ing-list">
        <li>
          <span>0.75 t de <span class="food-name">chocolat mi-sucré</span></span>
          <div class="ing-btn"><img src="./assets/pencil-square.svg" /></div>
        </li>
        <li>
          <span>0.75 t de <span class="food-name">beurre</span></span>
          <div class="ing-btn"><img src="./assets/pencil-square.svg" /></div>
        </li>
        <li>
          <span>1.25 t de <span class="food-name">sucre</span></span>
          <div class="ing-btn"><img src="./assets/pencil-square.svg" /></div>
        </li>
        <li>
          <span>3 <span class="food-name">oeuf</span></span>
          <div class="ing-btn"><img src="./assets/pencil-square.svg" /></div>
        </li>
        <li>
          <span>1 c. à thé d'<span class="food-name">extrait de vanille</span></span>
          <div class="ing-btn"><img src="./assets/pencil-square.svg" /></div>
        </li>
        <li>
          <span>0.5 c. à thé de <span class="food-name">café pour espresso moulu</span></span>
          <div class="ing-btn"><img src="./assets/pencil-square.svg" /></div>
        </li>
        <li>
          <span>1 pincée de <span class="food-name">sel</span></span>
          <div class="ing-btn"><img src="./assets/pencil-square.svg" /></div>
        </li>
        <li>
          <span>1 t de <span class="food-name">farine</span></span>
          <div class="ing-btn"><img src="./assets/pencil-square.svg" /></div>
        </li>
      </ul>

      <h2>Instructions</h2>
      <div class="recipe-instructions">
      </div>
    </div>
  </body>
</html>
